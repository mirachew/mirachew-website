<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <clipPath id="plot">
      <rect x="80" y="40" width="600" height="360"/>
    </clipPath>
  </defs>

  <rect width="760" height="480" fill="#ffffff"/>

  <g clip-path="url(#plot)">
    <!-- Initial test campaign: wide error band -->
    <polygon points="80,345 680,40 680,150 80,455" fill="#9e9e9e" fill-opacity="0.18"/>
    <!-- Refined test campaign: narrow error band -->
    <polygon points="80,384 680,44 680,76 80,416" fill="#1f6fb2" fill-opacity="0.22"/>

    <line x1="80" y1="400" x2="680" y2="95" stroke="#7a7a7a" stroke-width="2.5" stroke-dasharray="9 6"/>
    <line x1="80" y1="400" x2="680" y2="60" stroke="#1f6fb2" stroke-width="3"/>

    <g fill="none" stroke="#7a7a7a" stroke-width="2">
      <circle cx="138" cy="333.7" r="5"/>
      <circle cx="178" cy="389" r="5"/>
      <circle cx="218" cy="296.3" r="5"/>
      <circle cx="258" cy="338.7" r="5"/>
      <circle cx="298" cy="233" r="5"/>
      <circle cx="338" cy="286.3" r="5"/>
      <circle cx="378" cy="215.7" r="5"/>
      <circle cx="418" cy="258" r="5"/>
      <circle cx="458" cy="155.3" r="5"/>
      <circle cx="498" cy="205.7" r="5"/>
      <circle cx="538" cy="103" r="5"/>
      <circle cx="578" cy="152.3" r="5"/>
      <circle cx="618" cy="74.7" r="5"/>
      <circle cx="658" cy="97" r="5"/>
    </g>

    <g fill="#1f6fb2">
      <circle cx="124" cy="381.1" r="5"/>
      <circle cx="164" cy="344.4" r="5"/>
      <circle cx="204" cy="333.7" r="5"/>
      <circle cx="244" cy="302.1" r="5"/>
      <circle cx="284" cy="293.4" r="5"/>
      <circle cx="324" cy="258.7" r="5"/>
      <circle cx="364" cy="246.1" r="5"/>
      <circle cx="404" cy="210.4" r="5"/>
      <circle cx="444" cy="195.7" r="5"/>
      <circle cx="484" cy="162.1" r="5"/>
      <circle cx="524" cy="153.4" r="5"/>
      <circle cx="564" cy="121.7" r="5"/>
      <circle cx="604" cy="111.1" r="5"/>
      <circle cx="644" cy="73.4" r="5"/>
    </g>
  </g>

  <!-- Axes (intentionally no tick values) -->
  <line x1="80" y1="400" x2="690" y2="400" stroke="#333" stroke-width="2"/>
  <line x1="80" y1="400" x2="80" y2="30" stroke="#333" stroke-width="2"/>
  <polygon points="690,395 700,400 690,405" fill="#333"/>
  <polygon points="75,30 80,20 85,30" fill="#333"/>

  <text x="380" y="435" text-anchor="middle" font-size="16" fill="#333">Applied Torque</text>
  <text x="40" y="220" text-anchor="middle" font-size="16" fill="#333" transform="rotate(-90 40 220)">Measured Bolt Preload</text>

  <!-- Legend -->
  <g font-size="13" fill="#333">
    <rect x="96" y="50" width="250" height="84" fill="#ffffff" fill-opacity="0.9" stroke="#ccc"/>
    <circle cx="112" cy="68" r="5" fill="none" stroke="#7a7a7a" stroke-width="2"/>
    <text x="126" y="72">Initial tests</text>
    <line x1="102" y1="90" x2="122" y2="90" stroke="#7a7a7a" stroke-width="2.5" stroke-dasharray="6 4"/>
    <text x="126" y="94">Initial fit + wide error band</text>
    <circle cx="112" cy="112" r="5" fill="#1f6fb2"/>
    <line x1="102" y1="112" x2="122" y2="112" stroke="#1f6fb2" stroke-width="3"/>
    <text x="126" y="116">Refined method fit + narrow band</text>
  </g>

  <text x="380" y="466" text-anchor="middle" font-size="12" font-style="italic" fill="#777">Illustrative only: not to scale, no proprietary data shown.</text>
</svg>
